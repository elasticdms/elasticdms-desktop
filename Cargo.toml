# Cargo.toml — the folder client's workspace.
#
# One responsibility per crate, dependency direction strictly bottom-up (README, section "Crate
# cut"). The direction is checked by crates/architecture-rules on every `cargo test` — not by this
# header comment.
#
# Versions stand here and only here wherever it is at all possible ("a single truth", like the
# version catalog in the sister repository elasticdms-escan). State of the version check against
# crates.io: 2026-09-11.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/elasticdms/elasticdms-desktop"
# No crate of this workspace goes to crates.io: they are the parts of one application, and a
# `edms-store` or `edms-wire` on a public registry would promise an API that only this client uses.
publish = false

[workspace.dependencies]
# ── our own crates ───────────────────────────────────────────────────────────
edms-i18n = { path = "crates/i18n" }
edms-core = { path = "crates/core" }
edms-crypto = { path = "crates/crypto" }
edms-wire = { path = "crates/wire" }
edms-store = { path = "crates/store" }
edms-net = { path = "crates/net" }
edms-engine = { path = "crates/engine" }
edms-bridge = { path = "crates/bridge" }
edms-cfapi = { path = "crates/cfapi" }
edms-fileprovider = { path = "crates/fileprovider" }
edms-mock = { path = "crates/mock" }

# ── foreign crates ───────────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: without this feature serde_json reads some floating-point numbers one ULP off
# (measured: 333333333.33333329), and the JCS canonicalisation would write other bytes than the
# server — every signature of an honest server would stop holding. Features are unified across the
# workspace, which is why this stands here and not in a single crate.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

# Cryptography. One algorithm in the whole procedure: ES256 (geraete-auth §5.1).
p256 = "0.14.0"
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"

# Runtime, network, store.
tokio = "1.53.1"
reqwest = { version = "0.13.5", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
notify = "8.2.0"
axum = "0.8.9"
directories = "6.0.0"
open = "5.4.4"
tempfile = "3"

# User interface: icon in the taskbar/menu bar and the window (measured: both targets compile).
tao = "0.37"
wry = "0.57"
tray-icon = "0.24.2"

# macOS File Provider (measured: objc2-file-provider 0.3.2 carries NSFileProviderReplicatedExtension).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-file-provider = "0.3.2"
objc2-uniform-type-identifiers = "0.3"
block2 = "0.6"

# Windows Cloud Filter API, directly over the bindings (ADR-D06, correction to §1: cloud-filter
# was dropped because it aborts in the error path of a callback). Pinned exactly, so that a change
# of the bindings is a decision and not a side effect.
windows = "=0.58.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Values, not exceptions (README, "Errors"). Tests may, see clippy.toml.
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Incremental compilation off: its cache grew to 3.4 GB, and this machine has no 5 GB free. The
# recompilation takes longer, the result is the same.
[profile.dev]
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
