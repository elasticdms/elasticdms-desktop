# en.toml — every sentence the user reads in English.
#
# A real translation, not a placeholder: the English is written for an English reader, not
# transliterated from the German. Where the German keeps a German term because it is a legal term
# (Akte, GoBD), the English names the thing and puts the German term in brackets once — the same
# rule the comments in this house follow.
#
# English is also the fallback language (`edms_i18n::FALLBACK`): a workstation whose locale the
# client does not speak reads this file. That is why nothing here may be left half done.

# The language tag for Intl in the window (date and number formats).
locale.tag = "en-GB"

