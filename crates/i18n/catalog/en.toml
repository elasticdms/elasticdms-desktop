# ── The mirror: what stands in File Explorer and in Finder ───────────────────────────────────
#
# The file names of the hints stand here as well: in English the file is called README.txt, in
# German LIESMICH.txt. Whoever gets a view in their language gets all of it.
[mirror]
baskets = "Mailbaskets"
archives = "Archives"
searches = "Saved searches"
readme.name = "README.txt"
readme.body = """
elasticdms – folder view

This folder shows your mailbaskets, your archives with their case files
(Akten) and your saved searches from elasticdms. It is a view, not a filing
cabinet: you cannot save, change, rename or delete anything here. Files are
loaded only when you open them; every opening is recorded as an access.

"Always keep on this device" is NOT a guarantee.
If a document is erased, or your access to it is withdrawn, elasticdms removes
the copy from this device even when you have pinned it.

Put new documents into one of the folders under "Mailbaskets". That is the one
place here where you may put a file. Capture then opens in your browser; where
the document is filed is decided by the basket, not by this folder.
"""
truncated.name = "Result list truncated – README.txt"
truncated.body = """
This saved search has more hits than the folder can show.
The {count} most recent documents are shown.

Refine the search in your browser so that all hits appear.
"""

