# ── What the engine refuses, and why ─────────────────────────────────────────────────────────
#
# {reason} carries the technical account, and that stays English: what is a server judgement stays
# a server judgement, and a translated diagnosis could not be found again in a bug report.
[error.engine]
configuration = "The set-up of this workstation is incomplete: {reason}"
vault = "The operating system's keychain could not be used: {reason}"
store = "The local state could not be read or written: {reason}"
crypto = "A cryptographic check failed: {reason}"
directory = "\"{path}\" could not be set up: {reason}"
runtime = "elasticdms could not start its runtime: {reason}"
stopped = "elasticdms is shutting down."
not_signed_in = "Nobody is signed in."
enrollment_code_missing = "This device has not been set up yet; the enrolment code from the elasticdms console is missing."
refused = "The server refuses: {reason}"
session_expired = "The session has expired: {reason}"
no_network = "The elasticdms server cannot be reached: {reason}"
security = "Security abort: {reason}"
no_file_system = "The folder has not been set up on this device yet."
internal = "Internal error in the folder client: {reason}"

# ── What File Explorer and Finder show when the source cannot deliver ────────────────────────
[error.source]
