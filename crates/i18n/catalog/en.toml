not_found = "The entry \"{entry}\" no longer exists."
no_access = "No access to this document."
integrity = "The loaded content does not match the checksum (expected {expected}, received {actual}); the file was not taken over."
incomplete = "The server delivered {actual} instead of {expected} bytes; the file was not taken over."
anchor_expired = "The change marker is stale; the folder is being enumerated afresh."
cancelled = "The request was cancelled."
sink = "The loaded content could not be stored: {reason}"
server = "The server reports: {reason}"
internal = "Internal error in the folder client: {reason}"

