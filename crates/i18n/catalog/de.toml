# Zwei ihrer Seiten gibt es nur auf je einer Plattform — der Ort des Ordners unter Windows, die
# Erweiterung unter macOS. Die Sätze stehen hier trotzdem auf beiden: der Katalogtest misst die
# Dateien gegen die Schlüsselliste, nicht gegen die Seiten, die ein Build gerade mitbringt.
#
# Kein Satz hier nennt eine EDMS_*-Variable. Eine Variable ist eine Betreiberoberfläche und
# gehört in „doctor“, auf Englisch; wer vor diesem Fenster sitzt, soll lesen, was für sein Gerät
