# ── Der Spiegel: was im Explorer und im Finder steht ─────────────────────────────────────────
#
# Auch die Dateinamen der Hinweise stehen hier: auf Englisch heißt die Datei README.txt, auf
# Deutsch LIESMICH.txt. Wer eine Ansicht in seiner Sprache bekommt, bekommt sie ganz.
[mirror]
baskets = "Briefkörbe"
archives = "Archive"
searches = "Gespeicherte Suchen"
readme.name = "LIESMICH.txt"
readme.body = """
elasticdms – Ordneransicht

Dieser Ordner zeigt Ihre Briefkörbe, Ihre Archive mit deren Akten und Ihre
gespeicherten Suchen aus elasticdms. Er ist eine Ansicht, keine Ablage: Sie
können hier nichts speichern, ändern, umbenennen oder löschen. Dateien werden
erst beim Öffnen geladen; jedes Öffnen wird als Zugriff protokolliert.

„Immer auf diesem Gerät behalten“ ist KEINE Zusicherung.
Wird ein Dokument gelöscht oder Ihnen der Zugriff entzogen, entfernt elasticdms
die Kopie auch dann von diesem Gerät, wenn Sie sie angeheftet haben.

Neue Dokumente legen Sie in einen der Ordner unter „Briefkörbe“. Das ist hier
die einzige Stelle, an der Sie eine Datei ablegen dürfen. Die Erfassung öffnet
sich dann im Browser; wohin das Dokument abgelegt wird, entscheidet der
Briefkorb, nicht dieser Ordner.
"""
truncated.name = "Trefferliste gekappt – LIESMICH.txt"
truncated.body = """
Diese gespeicherte Suche hat mehr Treffer, als der Ordner zeigen kann.
Angezeigt werden die {count} neuesten Dokumente.

Verfeinern Sie die Suche im Browser, damit alle Treffer erscheinen.
"""

